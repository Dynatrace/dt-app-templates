name: Renovate config

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate renovate.json
        run: npx --yes --package renovate -- renovate-config-validator --strict
